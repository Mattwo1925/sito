<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Per te ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #9CAF88; /* verde salvia */
      font-family: "Georgia", serif;
      color: #ffffff;
      text-align: center;
    }

    .message {
      max-width: 800px;
      padding: 30px;
      font-size: 36px;
      line-height: 1.4;
    }

    .destination {
      font-size: 48px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="message">
    Amore mio,<br><br>
    perché i momenti più belli meritano di essere vissuti insieme,<br>
    ho una sorpresa per te…<br><br>

    <div class="destination">
      ✈️ Tenerife 💚
    </div>

    <br>
    Un viaggio solo nostro,<br>
    fatto di sole, mare e ricordi da creare mano nella mano.
  </div>
</body>
</html>
